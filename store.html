<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Store Information</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <header>
        <h1 id="storeName">Store Name</h1>
        <p id="storeLocation">Location</p>
    </header>


    <main>

        <a href="index.html">
            ← Back to Store Search
        </a>


        <section class="store-details">

            <h2 id="storeNameDetails"></h2>

            <p id="storeDescription"></p>


            <h3>Location</h3>

            <p id="storeAddress"></p>


            <h3>Price Range</h3>

            <p id="storeBudget"></p>


            <h3>Style</h3>

            <div id="storeStyles"></div>


            <h3>Clothing</h3>

            <div id="storeClothing"></div>


            <h3>Brands</h3>

            <div id="storeBrands"></div>


            <h3>Hours</h3>

            <p id="storeHours"></p>


            <h3>Website</h3>

            <a id="storeWebsite" href="#" target="_blank">
                Visit Website
            </a>

            <h3>Social Media Reviews</h3> 
            
            <div id="socialReviews" class="reviews-grid"> 
                <!-- Reviews will be added by JavaScript --> 
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
